[project]
name = "buildathon"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # UI
    "gradio>=5.0",
    # LLM + orchestration
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    # RAG
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # Ingest
    "pypdf>=4.0",
    "chardet>=5.0",
    "pandas>=2.0",
    # External search
    "tavily-python>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]
pipeline = [
    # NLI faithfulness gate
    "transformers>=4.40",
    "torch>=2.2",
]
evals = [
    "ragas>=0.1",
]
observability = [
    "langfuse>=2.0",
]
ner = [
    # PII NER — enable with PII_USE_NER=true (Gate 3)
    "spacy>=3.7",
]

[project.scripts]
dev   = "app.cli:dev"
start = "app.cli:start"
ui    = "app.cli:ui"
smoke = "app.cli:smoke"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "app", "ui", "eval"]
