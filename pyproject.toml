[project]
name = "buildathon"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    # API layer
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # UI
    "gradio>=5.0",
    # LLM + orchestration
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "langchain-openai>=0.2",
    "langchain-text-splitters>=0.3",
    "langgraph>=0.2",
    # RAG
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    # Ingest
    "pypdf>=4.0",
    "chardet>=5.0",
    "pandas>=2.0",
    # External search
    "tavily-python>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "pre-commit>=3.7",
]
pipeline = [
    # NLI faithfulness gate
    "transformers>=4.40",
    "torch>=2.2",
]
evals = [
    "ragas>=0.1",
]
observability = [
    "langfuse>=2.0",
]
ner = [
    # PII NER — enable with PII_USE_NER=true (Gate 3)
    "spacy>=3.7",
]

[project.scripts]
# Namespaced so installing the wheel never shadows common binary names
# like `dev` or `start` on a teammate's PATH.
bt-dev   = "app.cli:dev"
bt-start = "app.cli:start"
bt-ui    = "app.cli:ui"
bt-smoke = "app.cli:smoke"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["packages", "app", "ui", "evals"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]

[tool.ruff.lint.per-file-ignores]
# Regex signal tables read better on one line each
"app/guardrails/injection.py" = ["E501"]
"app/guardrails/pii.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
